<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101d1a"><title>Reception | SKOON Architecture</title><link rel="stylesheet" href="reception.css?v=1.4.0"><script defer src="reception.js?v=1.4.0"></script></head>
<body><header class="top"><a class="brand" href="index.html?office=skip" dir="ltr">SKOON<span>ARCHITECTURE</span></a><nav><a id="tour-link" href="office-tour.html" data-copy="tour"></a><a id="site-link" href="index.html?office=skip" data-copy="website"></a><button id="language" type="button">العربية</button></nav></header>
<main><section class="intro"><div><p class="eyebrow" data-copy="eyebrow"></p><h1 data-copy="heading"></h1><p class="lead" data-copy="intro"></p></div><div class="intro-photo"><img src="assets/office/entrance-v1.jpg" alt=""><span data-copy="photo"></span></div></section>
<div class="notice"><span class="dot"></span><p data-copy="notice"></p></div>
<section aria-labelledby="purpose-title"><div class="section-head"><div><span class="step">01</span><h2 id="purpose-title" data-copy="purposeTitle"></h2></div><p data-copy="purposeSub"></p></div><div class="purposes" id="purposes" role="group" aria-labelledby="purpose-title"></div></section>
<section aria-labelledby="departments-title"><div class="section-head"><div><span class="step">02</span><h2 id="departments-title" data-copy="departmentsTitle"></h2></div><p data-copy="departmentsSub"></p></div><div class="departments" id="departments"></div></section>
<section class="path"><div><span class="eyebrow" data-copy="nextEyebrow"></span><h2 data-copy="nextTitle"></h2><p data-copy="nextBody"></p></div><a id="return-tour" href="office-tour.html" data-copy="backTour"></a></section>
</main><footer><span dir="ltr">SKOON ARCHITECTURE</span><span data-copy="footer"></span></footer>
<dialog id="desk" aria-labelledby="desk-title"><div class="dialog-head"><span class="eyebrow" data-copy="deskEyebrow"></span><button class="close" id="close" type="button" aria-label="Close">×</button></div><h2 id="desk-title"></h2><p id="desk-description"></p><p class="staff-note" data-copy="staffNote"></p><a id="chat-link" class="gold" href="chat.html" style="display:inline-block;margin:12px 0" data-copy="chatChoice"></a><p data-copy="emailChoice"></p><div class="actions" id="actions" role="group"></div>
<form id="request-form"><label><span data-copy="name"></span><input id="visitor-name" required name="name" maxlength="100" autocomplete="name"></label><label><span data-copy="email"></span><input id="visitor-email" required name="email" type="email" maxlength="200" autocomplete="email" dir="ltr"></label><label><span data-copy="phone"></span><input id="visitor-phone" name="phone" type="tel" required minlength="7" maxlength="25" autocomplete="tel" dir="ltr" pattern="[+0-9 ()-]{7,25}"></label><label><span id="message-label"></span><textarea id="visitor-message" name="message" required maxlength="2000" rows="4"></textarea></label><label><input id="visitor-consent" type="checkbox" required> <span data-copy="consent"></span></label><div hidden aria-hidden="true"><input id="website-field" tabindex="-1" autocomplete="off"></div><p id="action-status" class="action-status"></p><button class="gold" type="submit" data-copy="review"></button><p class="privacy" data-copy="privacy"></p></form>
<section id="review" hidden aria-live="polite"><h3 data-copy="reviewTitle"></h3><dl id="review-details"></dl><p class="action-status" data-copy="notSent"></p><button class="gold" type="button" id="edit" data-copy="edit"></button><button id="email-compose" class="gold" style="display:inline-block;margin-top:15px" type="button" data-copy="openEmail"></button><p id="delivery-status" class="action-status" role="status"></p></section>
</dialog><noscript>Please enable JavaScript / يرجى تفعيل جافاسكريبت</noscript></body></html>
