<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKOON Assistant</title><link rel="stylesheet" href="reception.css?v=1.4.0"><link rel="stylesheet" href="chat.css?v=1.4.0"><script defer src="reception.js?v=1.4.0"></script><script defer src="chat.js?v=1.4.0"></script><style>[hidden]{display:none!important}#visitor-form input:not([type=checkbox]){display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #b9ad91;border-radius:6px;font:inherit}#visitor-form label{font-size:14px;line-height:1.6}</style></head><body data-page="chat"><header class="top"><a class="brand" id="home" href="reception.html" dir="ltr">SKOON<span>ARCHITECTURE</span></a><nav><a id="back" href="reception.html"></a><button id="language" type="button">العربية</button></nav></header><main class="chat-main"><aside><p class="eyebrow" id="label"></p><h1 id="heading"></h1><p id="intro"></p><label for="department" id="department-label"></label><select id="department"></select><p id="scope"></p><a id="tour" href="office-tour.html"></a></aside><section class="chat-panel" aria-labelledby="chat-title"><div class="chat-head"><div><strong id="chat-title"></strong><small id="identity"></small></div><button id="clear" type="button"></button></div><form id="visitor-form" style="padding:20px;display:grid;gap:12px"><h2 id="visitor-welcome" style="font-size:22px"></h2><label><span id="visitor-name-label"></span><input id="chat-name" required minlength="2" maxlength="100" autocomplete="name"></label><label><span id="visitor-phone-label"></span><input id="chat-phone" type="tel" required minlength="7" maxlength="25" autocomplete="tel" dir="ltr" pattern="[+0-9 ()-]{7,25}"></label><label><input id="chat-consent" type="checkbox" required> <span id="visitor-consent-label"></span></label><button class="gold" id="start-chat" type="submit"></button></form><div class="transcript" id="transcript" role="log" aria-live="polite" aria-relevant="additions"></div><div id="suggestions" class="suggestions"></div><p id="status" role="status"></p><a id="email-fallback" class="gold" style="margin:0 20px 12px;align-self:start" href="reception.html"></a><form id="chat-form"><label class="sr-only" for="message" id="message-label"></label><textarea id="message" required rows="2" maxlength="2000" dir="auto"></textarea><button class="gold" id="send" type="submit"></button></form><p class="chat-privacy" id="privacy"></p></section></main><noscript>Enable JavaScript / يرجى تفعيل جافاسكريبت</noscript></body></html>
