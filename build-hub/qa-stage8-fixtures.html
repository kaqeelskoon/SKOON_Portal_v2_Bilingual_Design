<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKOON Stage 8 Isolated QA Fixture</title>
<style>body{font:16px system-ui,sans-serif;max-width:780px;margin:auto;padding:24px;background:#f6f7f7;color:#132c2a}button{padding:12px;margin:7px;border:1px solid #aaa;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:15px;background:#fff;border:1px solid #ccc}strong{color:#a20}</style>
</head><body><h1>SKOON Stage 8 — Temporary synthetic browser fixture</h1>
<p><strong>For isolated QA preview only. Do not use on production or with real client data.</strong> It modifies only this preview origin's browser localStorage and stores the original value in sessionStorage for explicit restoration.</p>
<div><button id="v1">Seed old schema v1</button><button id="v2">Seed current schema v2</button><button id="badjson">Seed invalid JSON</button><button id="badurl">Seed unsafe URL</button></div>
<div><button id="app">Open actual Build Hub</button><button id="restore">RESTORE ORIGINAL DATA</button><button id="refresh">Read current QA state</button></div>
<pre id="state"></pre>
<script>
'use strict';
const KEY='skoon-build-directory-v1',LANG='skoon-hub-lang',snap='skoon-stage8-fixture-original',cat={id:'consultants',en:'Consultants',ar:'الاستشاريون',icon:'consultant',descEn:'Consultants',descAr:'استشاريون'};
const custom={id:'custom',category:'consultants',en:'My Firm',ar:'شركتي',url:'https://example.org/my-firm'};
const skoon=url=>({id:'skoon',category:'consultants',en:'SKOON Architecture',ar:'سكون للاستشارات الهندسية',url});
const scenarios={
v1:JSON.stringify({schemaVersion:1,categories:[cat],companies:[skoon(''),custom]}),
v2:JSON.stringify({schemaVersion:2,categories:[cat],companies:[skoon('https://skoonaiv2.vercel.app/index.html'),custom]}),
badjson:'{bad json',
badurl:JSON.stringify({schemaVersion:2,categories:[cat],companies:[{id:'bad',category:'consultants',en:'Unsafe',ar:'غير آمن',url:'javascript:alert(1)'}]})
};
function snapshot(){if(sessionStorage.getItem(snap)===null)sessionStorage.setItem(snap,JSON.stringify({directory:localStorage.getItem(KEY),lang:localStorage.getItem(LANG)}))}
function read(){const raw=localStorage.getItem(KEY);let summary;try{const d=JSON.parse(raw);summary={schemaVersion:d?.schemaVersion,companies:d?.companies?.map(c=>({id:c.id,url:c.url})),rawLength:raw?.length}}catch{summary={parseError:true,raw}};document.querySelector('#state').textContent=JSON.stringify({origin:location.origin,stored:summary,lang:localStorage.getItem(LANG),backupPresent:sessionStorage.getItem(snap)!==null},null,2)}
for(const k of Object.keys(scenarios))document.getElementById(k).onclick=()=>{snapshot();localStorage.setItem(KEY,scenarios[k]);localStorage.setItem(LANG,'ar');read()};
document.querySelector('#app').onclick=()=>location.assign('index.html');
document.querySelector('#restore').onclick=()=>{const s=sessionStorage.getItem(snap);if(s!==null){const d=JSON.parse(s);if(d.directory===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,d.directory);if(d.lang===null)localStorage.removeItem(LANG);else localStorage.setItem(LANG,d.lang);sessionStorage.removeItem(snap)}read()};
document.querySelector('#refresh').onclick=read;read();
</script></body></html>
