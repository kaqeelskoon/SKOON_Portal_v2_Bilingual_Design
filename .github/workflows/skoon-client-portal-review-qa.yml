name: SKOON client portal review demo QA
on:
  push:
    branches:
      - feature/client-portal-review-demo-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-portal-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax
        run: |
          node --check client-portal-demo.js
          node --check build-hub/app.js
          node --check app.js
          node --check tests/client-portal-review-browser.test.cjs
      - name: Install test browser
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test interactive bilingual client review
        run: node --test tests/client-portal-review-browser.test.cjs
      - name: Archive QS screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skoon-client-portal-review-evidence
          path: QS/client-portal-review-evidence/*.png
          retention-days: 14
          if-no-files-found: warn
