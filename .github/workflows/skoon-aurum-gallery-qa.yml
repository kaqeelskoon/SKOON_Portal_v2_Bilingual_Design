name: SKOON portfolio Aurum image QA
on:
  push:
    branches:
      - fix/aurum-gallery-image-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aurum-image-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JS source and isolated image QA syntax
        run: |
          node --check app.js
          node --check tests/aurum-gallery-visual.test.cjs
      - name: Install test browser
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test EN and AR desktop/mobile gallery and login
        run: node --test tests/aurum-gallery-visual.test.cjs
      - name: Save visual screenshots to QS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurum-p256-visual-qa
          path: QS/aurum-gallery-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
