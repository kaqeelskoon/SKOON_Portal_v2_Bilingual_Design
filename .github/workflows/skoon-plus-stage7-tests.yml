name: SKOON Plus Stage 7 source regression
on:
  push:
    branches:
      - skoon-plus/stage7-release-candidate-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bilingual-static-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check build-hub/app.js
          node --check tests/build-hub-i18n.test.cjs
      - name: Execute static regression suite
        run: node --test tests/build-hub-i18n.test.cjs

  browser-e2e-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Check browser test syntax
        run: node --check tests/build-hub-browser.test.cjs
      - name: Execute local real-browser regression
        run: node --test tests/build-hub-browser.test.cjs
      - name: Archive QA screenshots (internal workflow artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-qa-screenshots
          path: QS/stage7-browser-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
